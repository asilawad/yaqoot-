kind = "web"
previewPath = "/"
title = "Yaqoot Medical Clinic"
version = "1.0.0"
id = "artifacts/yaqoot-medical"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20342

[services.development]
run = "pnpm --filter @workspace/yaqoot-medical run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/yaqoot-medical", "run", "build" ]
publicDir = "artifacts/yaqoot-medical/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20342"
BASE_PATH = "/"
